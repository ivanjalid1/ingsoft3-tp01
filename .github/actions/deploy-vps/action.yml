name: Desplegar en el VPS
description: Despliega por SSH las imágenes sha-<sha> ya publicadas y espera a que la URL sirva ese commit.

inputs:
  url:
    description: URL pública del entorno a verificar (p.ej. https://qa.testingwebapp.site)
    required: true
  sha:
    description: Commit a desplegar (40 hex). Debe tener sus imágenes sha-<sha> en ghcr.io.
    required: true
  ssh-key:
    description: Key SSH privada del entorno (secrets.DEPLOY_SSH_KEY del environment)
    required: true
  host:
    description: Host del VPS (vars.VPS_HOST)
    required: true
  known-hosts:
    description: Línea(s) known_hosts fijas del VPS (vars.VPS_KNOWN_HOSTS)
    required: true

runs:
  using: composite
  steps:
    - name: Desplegar el commit (por SSH al VPS)
      shell: bash
      env:
        DEPLOY_SSH_KEY: ${{ inputs.ssh-key }}
        VPS_HOST: ${{ inputs.host }}
        VPS_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        KEY="$RUNNER_TEMP/deploy_key"
        KNOWN="$RUNNER_TEMP/known_hosts"
        trap 'rm -f "$KEY" "$KNOWN"' EXIT
        ( umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"; printf '%s\n' "$VPS_KNOWN_HOSTS" > "$KNOWN" )
        echo "IP pública del runner: $(curl -s --max-time 10 https://api.ipify.org || echo desconocida)"
        MAX_INTENTOS=4
        for intento in $(seq 1 "$MAX_INTENTOS"); do
          echo "Conexión SSH al VPS: intento $intento/$MAX_INTENTOS"
          rc=0
          ssh -i "$KEY" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$KNOWN" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            tp6deploy@"$VPS_HOST" "$SHA" || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -ne 255 ]; then
            echo "::error::El deploy remoto falló con código $rc (no es un error de conexión): no se reintenta"
            exit "$rc"
          fi
          if [ "$intento" -lt "$MAX_INTENTOS" ]; then
            espera=$((intento * 10))
            echo "::warning::ssh salió con 255 (falla de conexión) en el intento $intento/$MAX_INTENTOS; se reintenta en ${espera}s"
            sleep "$espera"
          fi
        done
        echo "::error::No se pudo conectar por SSH al VPS después de $MAX_INTENTOS intentos"
        exit 255

    - name: Smoke test (espera a que el entorno conteste con ESTE commit)
      shell: bash
      env:
        URL: ${{ inputs.url }}
        SHA: ${{ inputs.sha }}
      run: |
        for i in $(seq 1 30); do
          HEALTH=""
          VERSION=""
          if HEALTH=$(curl -fsS --max-time 10 "$URL/api/health"); then
            VERSION=$(jq -r '.version // empty' <<<"$HEALTH" 2>/dev/null || true)
          fi
          if [ -z "$HEALTH" ]; then
            echo "[$i/30] /api/health no responde 200"
          elif [ "$VERSION" != "$SHA" ]; then
            echo "[$i/30] /api/health responde la versión '${VERSION:-?}', se espera $SHA"
          elif ! curl -fsS --max-time 10 -o /dev/null "$URL/api/health/db"; then
            echo "[$i/30] /api/health/db no responde 200 (la base o el esquema no están)"
          elif ! curl -fsS --max-time 10 -o /dev/null "$URL/"; then
            echo "[$i/30] / (frontend) no responde 200"
          else
            echo "$URL sirve el commit $SHA: health, base y frontend OK"
            exit 0
          fi
          sleep 20
        done
        echo "::error::Smoke test fallido: $URL no quedó sirviendo el commit $SHA con health, base y frontend OK después de 30 intentos (~10 min)"
        exit 1
